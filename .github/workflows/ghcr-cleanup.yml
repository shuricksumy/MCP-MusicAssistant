name: GHCR package cleanup

# docker-publish.yml pushes a `main` branch-alias tag and a short-sha tag on every push to main
# (plus `latest` via docker/metadata-action's default flavor, and semver tags on a release tag
# push) -- the sha tags accumulate forever with nothing to clean them up. Ran dry-run/manual-only
# first, reviewed the "would delete" output, then went live here. Still runnable on demand via
# workflow_dispatch alongside the schedule.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old ghcr.io package versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: shuricksumy
          # Published as ghcr.io/shuricksumy/music-assistant-mcp -- IMAGE_NAME in
          # docker-publish.yml is repository_owner-scoped, not the repo name.
          package: 'music-assistant-mcp'
          # Keep `latest` and any release tag (1.2.3, 1.2, ...); delete every other tag (i.e. the
          # `main` branch-alias tag and every short-sha build tag) plus orphaned untagged
          # multi-arch layers.
          delete-tags: '.*'
          # Flat alternation instead of a quantified group with an internal quantifier
          # (`(\.[0-9]+)?`) -- the latter trips the action's ReDoS heuristic (nested quantifiers)
          # even though it isn't actually vulnerable; confirmed live against the same pattern
          # shape in frigate-yard-stats's copy of this workflow ("exclude-tags: regex pattern
          # rejected as ReDoS-prone").
          exclude-tags: '^latest$|^[0-9]+\.[0-9]+$|^[0-9]+\.[0-9]+\.[0-9]+$'
          use-regex: true
          delete-untagged: true
          dry-run: false
          log-level: info
